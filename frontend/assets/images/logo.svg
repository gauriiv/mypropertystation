<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- White Circular Badge Container (No Outer Background) -->
    <circle cx="100" cy="100" r="95" fill="#ffffff"/>
    
    <!-- Black House Roof Outline -->
    <path d="M 38,82 L 100,24 L 162,82 L 150,82 L 100,35 L 50,82 Z" fill="#181818"/>
    
    <!-- Red 4-Pane Grid Window -->
    <g fill="#e62e2e">
        <rect x="91" y="55" width="8" height="8" rx="1"/>
        <rect x="101" y="55" width="8" height="8" rx="1"/>
        <rect x="91" y="65" width="8" height="8" rx="1"/>
        <rect x="101" y="65" width="8" height="8" rx="1"/>
    </g>

    <!-- Coral / Terracotta Handshake Base -->
    <g fill="#f16745">
        <!-- Left Arm Sleeve -->
        <path d="M 40,84 L 62,84 C 62,84 62,125 58,135 C 56,140 44,140 42,135 C 38,125 40,84 40,84 Z"/>
        <circle cx="51" cy="94" r="3.5" fill="#ffffff"/>

        <!-- Right Arm Sleeve -->
        <path d="M 160,84 L 138,84 C 138,84 138,125 142,135 C 144,140 156,140 158,135 C 162,125 160,84 160,84 Z"/>
        <circle cx="149" cy="94" r="3.5" fill="#ffffff"/>

        <!-- Handshake Center Clasp -->
        <path d="M 62,92 C 70,105 82,120 100,148 C 102,151 106,151 108,148 L 138,114 C 142,109 142,102 137,98 C 132,94 125,94 120,98 L 100,120 C 96,124 90,124 86,120 C 82,116 82,110 86,106 L 106,86 C 112,80 110,70 100,70 C 90,70 82,78 74,86 Z"/>
        
        <!-- Finger Cuts -->
        <path d="M 94,140 L 126,104 C 129,101 133,102 135,105 C 137,108 136,112 133,115 L 101,151 C 98,154 94,153 92,150 Z" opacity="0.95"/>
        <path d="M 84,130 L 118,92 C 121,89 125,90 127,93 C 129,96 128,100 125,103 L 91,141 C 88,144 84,143 82,140 Z" opacity="0.95"/>
    </g>
</svg>
